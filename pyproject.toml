[project]
name = "hanbit-aiagent"
version = "1.0.0"
description = "만들면서 배우는 AI 에이전트 개발 - 실습 코드"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "공원나연", email = "uoahvu@gmail.com" }
]

dependencies = [
    # ── LangChain / LangGraph (v1 계열) ────────────────────────────────
    # 예제가 v1 API(`from langchain.agents import create_agent`)를 쓰므로
    # 메이저 상한(<2)을 걸어 v2 자동 업그레이드를 막는다.
    "langchain>=1.3.18,<2",
    "langgraph>=1.2.11,<2",
    "langchain-openai>=1.6.0,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langchain-chroma>=1.1.0,<2",
    "langchain-community>=0.4.2",
    "langchain-tavily>=0.2.18",
    "langgraph-cli[inmem]>=0.4.31",
    # ── MCP (9장) ─────────────────────────────────────────────────────
    # 예제가 v1 API(`from mcp.server.fastmcp import FastMCP`)를 쓴다.
    # v2는 `from mcp.server import MCPServer`로 바뀌므로 <2 로 고정.
    "mcp>=1.26.0,<2",
    "langchain-mcp-adapters>=0.3.2",
    # ── A2A (10·11장) ─────────────────────────────────────────────────
    # 예제가 프로토콜 스펙 0.3 기준이다. SDK 1.x는 스펙 1.0이라 호환되지 않으므로 <1 로 고정.
    "a2a-sdk>=0.3.25,<1",
    # ── 그 외 ─────────────────────────────────────────────────────────
    "openai>=3.6.0",
    "python-dotenv>=1.2.3",
    "pypdf>=6.16.2",
    "beautifulsoup4>=4.15.0",
    "supabase>=2.31.0",
    "docx2txt>=0.9",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
]
